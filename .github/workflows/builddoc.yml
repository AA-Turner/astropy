name: Render documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  UV_SYSTEM_PYTHON: "1"  # make uv do global installs

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: docs/rtd_environment.yaml
        cache-environment: true
        post-cleanup: 'all'

    - name: Install dependencies
      run: python -m pip install --upgrade --upgrade-strategy only-if-needed --no-cache-dir -r docs/reqs.txt

    - name: Install package
      run: python -m pip install --upgrade --upgrade-strategy only-if-needed --no-cache-dir .[docs]

    - run: python -VV

    - run: python -m sphinx --version

    - name: Render the documentation
      run: >
        python -m sphinx build
        -M html ./docs/conf.py ./docs/build/
        --jobs=auto
        --show-traceback
        --fail-on-warning

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        path: ./docs/build/
        retention-days: 5
